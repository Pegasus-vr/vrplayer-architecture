<rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#0f1218"/><rect width="1920" height="1080" fill="url(#grid)"/><text x="56.0" y="58.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="#f0f3f8" letter-spacing="-0.4">USER FLOW · WHAT YOU DO</text><text x="56.0" y="96.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#b4bcc9">Quest wearer journey · right controller first (P4) · human verbs</text><rect x="1420.0" y="42.0" width="440.0" height="36.0" rx="6" fill="#1a1810" stroke="#c97a3a" stroke-width="1.4" stroke-dasharray="4 3"/><text x="1640.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c97a3a" letter-spacing="0.6">H0 SCOPE · PROPOSED PRODUCT UI</text><rect x="48.0" y="180.0" width="342.4" height="300.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="84.0" cy="222.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="84.0" y="230.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">1</text><text x="118.0" y="230.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f3f8">Open the app</text><text x="72.0" y="276.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Put on Quest 3</text><text x="72.0" y="304.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Launch player / QA build</text><text x="72.0" y="458.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#c97a3a">H0: com.vrplayer.qa</text><rect x="418.4" y="180.0" width="342.4" height="300.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="454.4" cy="222.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="454.4" y="230.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">2</text><text x="488.4" y="230.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f3f8">Pick a source</text><text x="442.4" y="276.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Local file · or home</text><text x="442.4" y="304.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Library is first surface</text><text x="442.4" y="458.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#c97a3a">H0: one synthetic clip</text><rect x="788.8" y="180.0" width="342.4" height="300.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="824.8" cy="222.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="824.8" y="230.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">3</text><text x="858.8" y="230.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f3f8">Start the clip</text><text x="812.8" y="276.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">One action to play</text><text x="812.8" y="304.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Expect picture in ~1 s</text><rect x="1159.2" y="180.0" width="342.4" height="300.0" rx="16" fill="#171c26" stroke="#3aa0e8" stroke-width="2.4"/><circle cx="1195.2" cy="222.0" r="22.0" fill="#1a1810" stroke="#3aa0e8" stroke-width="2.2"/><text x="1195.2" y="230.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#3aa0e8">4</text><text x="1229.2" y="230.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f3f8">Watch &amp; control</text><text x="1183.2" y="276.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Play · pause · seek</text><text x="1183.2" y="304.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Right controller, one hand</text><text x="1183.2" y="458.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#c97a3a">P4 · product UI open</text><rect x="1529.6" y="180.0" width="342.4" height="300.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="1565.6" cy="222.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="1565.6" y="230.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">5</text><text x="1599.6" y="230.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f3f8">Exit or next</text><text x="1553.6" y="276.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Back · dismiss · resume</text><text x="1553.6" y="304.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Leave when done</text><path d="M394.4 330.0 H414.4" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><text x="404.4" y="316.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e2a83a">you</text><path d="M764.8 330.0 H784.8" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><path d="M1135.2 330.0 H1155.2" fill="none" stroke="#3aa0e8" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mc)"/><path d="M1505.6 330.0 H1525.6" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><rect x="48.0" y="508.0" width="1824.0" height="72.0" rx="8" fill="#1e2633" stroke="#3a4456" stroke-width="1.2"/><text x="68.0" y="536.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7d8798" letter-spacing="1.0">SOURCE CHOICE</text><text x="68.0" y="562.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b4bcc9">Local URI  ·  Home server (HTTP range)  ·  H0 uses one local synthetic 8K60 clip  ·  SMB later</text><text x="56.0" y="618.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7d8798" letter-spacing="1.2">READ IN SECONDS</text><text x="56.0" y="646.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="500" fill="#b4bcc9">This is the person. Not the stack. Controllers drive play/pause/seek when product UI ships (P4).</text><text x="56.0" y="672.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="500" fill="#c97a3a">H0 gate: one clip plays and measures itself. Full browse / library UI is still open.</text><path d="M56 1024 H1864" fill="none" stroke="#3a4456" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/><text x="56.0" y="1052.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#7d8798">Wearer journey · proposed · Quest 3 / Horizon OS</text><text x="1864.0" y="1052.0" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#b4bcc9">open → pick → start → watch → exit</text></svg>
