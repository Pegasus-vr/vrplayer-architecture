<rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#0f1218"/><rect width="1920" height="1080" fill="url(#grid)"/><text x="56.0" y="58.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="#f0f3f8" letter-spacing="-0.4">HOW A VR CLIP GETS TO YOUR EYES</text><text x="56.0" y="96.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#b4bcc9">Blueprint A · Unity shell + Kotlin Media3 over JNI</text><rect x="1480.0" y="42.0" width="380.0" height="36.0" rx="6" fill="#1a1810" stroke="#9a7428" stroke-width="1.4" stroke-dasharray="4 3"/><text x="1670.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e2a83a" letter-spacing="0.8">DECODE NEVER IN UNITY · NO AVPRO</text><rect x="48.0" y="200.0" width="342.4" height="280.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="84.0" cy="242.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="84.0" y="250.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">1</text><text x="118.0" y="250.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3f8">Video arrives</text><text x="76.0" y="292.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Home server over Wi-Fi,</text><text x="76.0" y="320.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">or a file already on</text><text x="76.0" y="348.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">the Quest.</text><rect x="418.4" y="200.0" width="342.4" height="280.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="454.4" cy="242.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="454.4" y="250.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">2</text><text x="488.4" y="250.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3f8">Kotlin decodes</text><text x="446.4" y="292.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Media3 drives hardware</text><text x="446.4" y="320.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">decode (MediaCodec).</text><text x="446.4" y="348.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Not Unity. No AVPro.</text><text x="446.4" y="458.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e2a83a">decode stays in Kotlin</text><rect x="788.8" y="200.0" width="342.4" height="280.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="824.8" cy="242.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="824.8" y="250.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">3</text><text x="858.8" y="250.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3f8">Cross the bridge</text><text x="816.8" y="292.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">A surface / buffer</text><text x="816.8" y="320.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">crosses the one JNI</text><text x="816.8" y="348.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">seam into Unity.</text><rect x="1159.2" y="200.0" width="342.4" height="280.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="1195.2" cy="242.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="1195.2" y="250.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">4</text><text x="1229.2" y="250.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3f8">Unity places it</text><text x="1187.2" y="292.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Direct layer · 180/360.</text><text x="1187.2" y="320.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Lens mesh · fisheye.</text><text x="1187.2" y="458.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#c97a3a">mesh path · least proven</text><rect x="1529.6" y="200.0" width="342.4" height="280.0" rx="16" fill="#171c26" stroke="#e2a83a" stroke-width="2.4"/><circle cx="1565.6" cy="242.0" r="22.0" fill="#1a1810" stroke="#e2a83a" stroke-width="2.2"/><text x="1565.6" y="250.0" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2a83a">5</text><text x="1599.6" y="250.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3f8">Eyes see it</text><text x="1557.6" y="292.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">Meta compositor shows</text><text x="1557.6" y="320.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">the frame to both</text><text x="1557.6" y="348.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#b4bcc9">displays.</text><path d="M394.4 340.0 H414.4" fill="none" stroke="#e2a83a" stroke-width="17.0" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/><path d="M394.4 340.0 H414.4" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><text x="404.4" y="326.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e2a83a">video</text><path d="M764.8 340.0 H784.8" fill="none" stroke="#e2a83a" stroke-width="17.0" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/><path d="M764.8 340.0 H784.8" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><path d="M1135.2 340.0 H1155.2" fill="none" stroke="#e2a83a" stroke-width="17.0" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/><path d="M1135.2 340.0 H1155.2" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><path d="M1505.6 340.0 H1525.6" fill="none" stroke="#e2a83a" stroke-width="17.0" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/><path d="M1505.6 340.0 H1525.6" fill="none" stroke="#e2a83a" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/><text x="56.0" y="536.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7d8798" letter-spacing="1.2">SIDE NOTES · not the main story</text><circle cx="68.0" cy="572.0" r="6.0" fill="#0f1218" stroke="#3aa0e8" stroke-width="2"/><path d="M82 572 H118" fill="none" stroke="#3aa0e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mc)"/><text x="130.0" y="577.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#3aa0e8">Control</text><text x="210.0" y="577.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#b4bcc9">controllers → Unity shell → JNI → Kotlin playback</text><circle cx="68.0" cy="610.0" r="6.0" fill="#0f1218" stroke="#3ccf7a" stroke-width="2"/><path d="M82 610 H118" fill="none" stroke="#3ccf7a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#mm)"/><text x="130.0" y="615.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#3ccf7a">Measure</text><text x="220.0" y="615.0" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#b4bcc9">QA probe leaves the app → verification bench  ·  never from the compositor</text><path d="M56 1024 H1864" fill="none" stroke="#3a4456" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/><text x="56.0" y="1052.0" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#7d8798">One gold path · five steps · Quest 3 / Horizon OS</text><text x="1864.0" y="1052.0" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#b4bcc9">file → decode → JNI → place → eyes</text></svg>
