<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vrplayer architecture</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0f1218;
      color: #a8b0bf;
      font: 15px/1.45 "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 650;
      color: #e8edf5;
      letter-spacing: -0.02em;
    }
    p.sub {
      margin: 0 0 20px;
      color: #7d8798;
      font-size: 14px;
    }
    figure {
      margin: 0 0 28px;
    }
    figcaption {
      margin: 10px 0 0;
      font-size: 13px;
      color: #7d8798;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      background: #0f1218;
    }
    a { color: #a8b0bf; }
    p.more {
      margin: 0 0 40px;
      font-size: 13px;
      color: #7d8798;
    }
  </style>
</head>
<body>
  <main>
    <h1>How a VR clip gets to your eyes</h1>
    <p class="sub">Blueprint A · Unity shell + Kotlin Media3 over JNI</p>
    <figure>

        src="architecture-diagram.png?v=20261113eng"

        height="1080"
      />
      <figcaption>Primary · one gold path, five steps</figcaption>
    </figure>
    <p class="more">
      Prefer containers and trust boundaries?
      <a href="architecture-diagram-c4.png?v=20261113eng">Detailed C4 poster</a>

</html>
