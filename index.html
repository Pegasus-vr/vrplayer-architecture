<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vrplayer architecture</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0f1218;
      color: #a8b0bf;
      font: 15px/1.45 "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 650;
      color: #e8edf5;
      letter-spacing: -0.02em;
    }
    p.sub {
      margin: 0 0 20px;
      color: #7d8798;
      font-size: 14px;
    }
    figure {
      margin: 0 0 40px;
    }
    figcaption {
      margin: 10px 0 0;
      font-size: 13px;
      color: #7d8798;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      background: #0f1218;
    }
    a { color: #a8b0bf; }
  </style>
</head>
<body>
  <main>
    <h1>vrplayer architecture</h1>
    <p class="sub">Proposed Blueprint A · Unity shell + Kotlin Media3 over JNI · D26 pending</p>
    <figure>
      <img
        src="architecture-diagram.png?v=20261112c4"

        width="1920"
        height="1180"
      />
      <figcaption>Primary view · containers, trust boundaries, three flows (video / control / measure)</figcaption>
    </figure>
    <figure>
      <img
        src="tech-stack-diagram.png"

        height="2680"
      />

    </figure>
